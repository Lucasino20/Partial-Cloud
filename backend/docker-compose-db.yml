version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: utec
      POSTGRES_DB: bd_api_orders
    ports:
      - "5432:5432"
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
    restart: always

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: utec
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    restart: always

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: utec
    ports:
      - "27017:27017"
    volumes:
      - mongo_catalogo_data:/data/db
    restart: always

volumes:
  pg_orders_data:
  mysql_users_data:
  mongo_catalogo_data:
